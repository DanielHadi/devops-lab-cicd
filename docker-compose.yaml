services:
  api:
    image: gjcr.io/danielhadi/devops-api:latest
    container_name: dotnet-backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always
